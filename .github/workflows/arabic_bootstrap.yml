name: Build Arabic bootstrap
on:
  workflow_dispatch:
  push:
    branches: [arabic-pkg]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Build bootstrap
        run: chmod a+rwx . && ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-aarch64
          path: bootstrap-*.zip
